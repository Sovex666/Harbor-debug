name: windows-debug-build

# Builds the same debug exe the perf rounds use locally (`pnpm tauri build --debug --no-bundle`)
# and uploads it with the files it loads from its own folder. Run the exe from the extracted
# folder; never copy just harbor.exe.
on:
  workflow_dispatch:
  push:
    branches:
      - "perf/**"

permissions:
  contents: read

concurrency:
  group: windows-debug-build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  build:
    name: Windows debug exe
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: debug

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Pokémon engine SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      # Only the Games feature needs it; a failure here must not block the perf build.
      - name: Build Pokémon engine
        continue-on-error: true
        run: node tools/pokemon-engine/build.mjs --fetch-source "${{ runner.temp }}/harbor-pokemon-source" --output src-tauri/resources/pokemon-engine --artifacts "${{ runner.temp }}/harbor-pokemon-build"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # The upstream release that hosted libmpv is gone; this mirror holds the same file, and
      # fetch-libmpv.mjs still checks its pinned SHA-256.
      - name: Fetch libmpv
        env:
          HARBOR_LIBMPV_URL: https://github.com/${{ github.repository }}/releases/download/libmpv-windows-x64/libmpv-2.dll
        run: pnpm run setup:libmpv

      - name: Fetch mpv
        run: pnpm run setup:mpv

      - name: Fetch external binaries
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cd src-tauri/binaries
          TARGET=x86_64-pc-windows-msvc
          curl --retry 6 --retry-delay 4 --retry-all-errors -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -o "yt-dlp-${TARGET}.exe"
          curl --retry 6 --retry-delay 4 --retry-all-errors -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -o ffmpeg.zip
          unzip -j ffmpeg.zip "*/bin/ffmpeg.exe" "*/bin/ffprobe.exe"
          mv ffmpeg.exe "ffmpeg-${TARGET}.exe"
          mv ffprobe.exe "ffprobe-${TARGET}.exe"
          rm ffmpeg.zip

      # beforeBuildCommand stages capstan, whose deps.sh fetched this jar from the same gone
      # upstream release; the mirror holds the same file and deps.sh still checks its SHA-256.
      # Benchmark builds get their own identifier (own app data, WebView2 profile and
      # single-instance lock) and register no URL schemes, so they never touch the
      # production app.harbor profile or its deep-link handlers.
      - name: Bench identity
        shell: pwsh
        run: |
          $suffix = ("${{ github.ref_name }}" -replace '^perf/', '') -replace '[^a-z0-9-]', '-'
          $conf = [ordered]@{
            identifier = "app.harbor.$suffix"
            plugins = @{ 'deep-link' = @{ mobile = @(); desktop = @{ schemes = @() } } }
          } | ConvertTo-Json -Depth 6
          $path = Join-Path $env:RUNNER_TEMP 'bench.conf.json'
          [IO.File]::WriteAllText($path, $conf)
          Get-Content $path
          "BENCH_CONF=$path" >> $env:GITHUB_ENV
          "BENCH_ID=app.harbor.$suffix" >> $env:GITHUB_ENV

      # ort-sys (pulled in by asr-whisper on trees that have it) panics on Windows when its
      # OUT_DIR/../../.. copy destinations are missing; same fix as Initialize-OrtRuntimeDirectories.
      - name: Prepare ort-sys output directories
        shell: pwsh
        run: |
          foreach ($base in 'src-tauri/target/debug', 'src-tauri/target/debug/build') {
            foreach ($d in $base, "$base/examples", "$base/deps") { New-Item -ItemType Directory -Force $d | Out-Null }
          }

      - name: Tauri debug build (exe only)
        env:
          HARBOR_NANOJSON_URL: https://github.com/${{ github.repository }}/releases/download/nanojson-e9d656d/nanojson-e9d656d.jar
        run: pnpm tauri build --debug --no-bundle --config "$env:BENCH_CONF"

      - name: Stage the runnable folder
        shell: pwsh
        run: |
          $src = 'src-tauri/target/debug'
          $out = 'harbor-debug'
          New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem $src -File | Where-Object { $_.Extension -in '.exe', '.dll' } |
            Copy-Item -Destination $out
          if (Test-Path "$src/build") {
            Get-ChildItem "$src/build" -File -Filter '*.dll' | Where-Object { $_.Name -match '^(?:onnxruntime.*|DirectML)\.dll$' } |
              Copy-Item -Destination $out -Force
          }
          foreach ($dir in 'resources', 'fonts', 'notices') {
            if (Test-Path "$src/$dir") { Copy-Item "$src/$dir" -Destination $out -Recurse }
          }
          "commit $env:GITHUB_SHA`nbuilt $(Get-Date -Format o)`nidentifier $env:BENCH_ID" | Set-Content "$out/BUILD-INFO.txt"
          Get-ChildItem $out | Format-Table Name, Length

      - name: Upload debug build
        uses: actions/upload-artifact@v4
        with:
          name: harbor-windows-debug
          path: harbor-debug
          retention-days: 14
